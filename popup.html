<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bug Tracer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <div class="header">
      <div class="header-content">
        <h1>🐛 Bug Tracer</h1>
        <button id="settingsButton" class="settings-btn" title="Settings">
          ⚙️
        </button>
      </div>
    </div>

  <!-- Main Content -->
  <div class="main-content">
    <!-- Recording Section -->
    <div class="recording-section">
      <button id="recordButton" class="record-button start">
        <span id="recordIcon">🔴</span>
        <span id="recordText">Start</span>
      </button>
      
      <div id="recordingStatus" class="recording-status">
        <span id="statusText">Ready</span>
        <span id="durationText" class="duration" style="display: none;">00:00</span>
      </div>
    </div>

    <!-- Recordings List -->
    <div class="recordings-section">
      <div class="section-header">
        <h3>Recent</h3>
        <span id="recordingsCount" class="count">0</span>
      </div>
      
      <div id="recordingsList" class="recordings-list">
        <div id="emptyState" class="empty-state">
          <div class="empty-icon">📹</div>
          <p>None</p>
        </div>
      </div>
    </div>
  </div>
  </div>

  <!-- Notification Container -->
  <div id="notificationContainer"></div>

  <!-- Scripts -->
  <script src="storage.js"></script>
  <script src="upload-providers/all-providers.js"></script>
  <script src="upload-manager.js"></script>
  <script src="popup.js"></script>
</body>
</html>
